version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "zak39"
    commit-message:
      prefix: "npm"
    labels:
      - "npm"
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "/"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "zak39"
    commit-message:
      prefix: "Composer"
    ignore:
      # PHPUnit follows the major version used by nextcloud/server (vendor-bin/phpunit),
      # which also has to run on the lowest PHP version tested by the CI.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
    labels:
      - "composer"
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "/"